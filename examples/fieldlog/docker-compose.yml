# Development only. Production runs the same image on the EU host described in docs/plan.md.
services:
  api:
    build: .
    image: fieldlog-api:dev
    env_file: .env            # copy .env.example to .env; never commit .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fieldlog
      POSTGRES_USER: fieldlog
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldlog -d fieldlog"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  db-data:
secrets:
  db_password:
    file: ./secrets/db_password.txt   # git-ignored
